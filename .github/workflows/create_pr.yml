name: Gemini Issue to PR

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pr:
    if: contains(github.event.issue.body, '@gemini-cli')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Gemini CLI Code Fix
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Fix the following issue by modifying or adding files in the workspace.
            Issue Title: ${{ github.event.issue.title }}
            Issue Body: ${{ github.event.issue.body }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: automated code generation from Gemini for #${{ github.event.issue.number }}"
          title: "fix: ${{ github.event.issue.title }}"
          body: |
            This is an automated PR generated by Gemini in response to issue #${{ github.event.issue.number }}.

            Please review the generated code carefully before merging.

            Closes #${{ github.event.issue.number }}
          branch: gemini/patch-issue-${{ github.event.issue.number }}
          base: main
          labels: go,ai-generated
          sign-commits: true